# XcodeGen spec: generates LearnWise.xcodeproj (https://github.com/yonaskolb/XcodeGen).
# The generated project is committed, so you only need XcodeGen if you change this file:
#   brew install xcodegen && xcodegen generate
name: LearnWise

options:
  bundleIdPrefix: com.learnwise
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # Swift 5 language mode: the same default a new Xcode project uses, and it keeps
    # strict-concurrency checks as warnings rather than errors.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  LearnWise:
    type: application
    platform: iOS
    sources:
      - path: LearnWise
    configFiles:
      Debug: LearnWise/Config/LearnWise.xcconfig
      Release: LearnWise/Config/LearnWise.xcconfig
    info:
      path: LearnWise/Info.plist
      properties:
        CFBundleDisplayName: LearnWise
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Filled in from LearnWise.xcconfig / Secrets.xcconfig at build time.
        GEMINI_API_KEY: $(GEMINI_API_KEY)
        GEMINI_MODEL: $(GEMINI_MODEL)
        YOUTUBE_API_KEY: $(YOUTUBE_API_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.learnwise.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic

  LearnWiseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LearnWiseTests
    dependencies:
      - target: LearnWise
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.learnwise.app.tests

  LearnWiseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LearnWiseUITests
    dependencies:
      - target: LearnWise
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.learnwise.app.uitests

schemes:
  LearnWise:
    build:
      targets:
        LearnWise: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - LearnWise
      targets:
        - LearnWiseTests
        - LearnWiseUITests
